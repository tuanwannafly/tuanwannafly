# Path: .github/workflows/snake.yml (in your profile repo)
# What it does: every day, redraws a "snake" that eats your contribution graph squares
# into an animated SVG, then pushes that image to the "output" branch to embed in README.md

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # runs daily at 00:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
